apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tp-app
  labels:
    app: frontend
spec:
  type: LoadBalancer  # à adapter selon environnement (NodePort/ClusterIP + Ingress si cluster sans LB externe)
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: frontend
